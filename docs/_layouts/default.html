<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <!-- Fuentes medievales -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Merriweather&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Merriweather', serif;
      background: radial-gradient(circle at top, #1a0f0a, #000);
      color: #e0d8b0;
      font-size: 15px;
      line-height: 1.7;
      background-attachment: fixed;
    }

    header {
      background: rgba(30, 20, 10, 0.9);
      border-bottom: 4px solid #a67c52;
      text-align: center;
      padding: 25px;
      box-shadow: 0 0 25px rgba(166, 124, 82, 0.6);
    }

    header img {
      max-height: 120px;
      display: block;
      margin: 0 auto 10px;
      filter: drop-shadow(0 0 10px #a67c52);
    }

    header h1 {
      font-family: 'Cinzel Decorative', cursive;
      color: #d4af37;
      margin: 0;
      text-shadow: 0 0 10px #a67c52, 0 0 20px #d4af37;
    }

    header p {
      color: #cbb994;
      margin: 5px 0 0;
      font-style: italic;
    }

    main {
      padding: 30px;
      max-width: 900px;
      margin: 40px auto;
      background: rgba(25, 15, 10, 0.85);
      border-radius: 12px;
      border: 3px solid #a67c52;
      box-shadow: 0 0 25px rgba(166, 124, 82, 0.6);
    }

    a {
      color: #d4af37;
      text-decoration: none;
      font-family: 'Cinzel Decorative', cursive;
    }

    a:hover {
      text-shadow: 0 0 10px #a67c52;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: rgba(20, 10, 5, 0.9);
      border-top: 3px solid #a67c52;
      color: #e0d8b0;
      font-size: 13px;
      box-shadow: 0 -5px 15px rgba(166, 124, 82, 0.5);
    }

    footer a {
      color: #d4af37;
      margin: 0 10px;
      text-decoration: none;
    }

    footer a:hover {
      text-shadow: 0 0 10px #a67c52;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" style="text-decoration:none; color:inherit;">
      <img src="/assets/img/logo.png" alt="Logo Bastión Arcano">
      <h1>⚜ Bastión Arcano ⚜</h1>
      <p>Reinos, magia y acero</p>
    </a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © 2026 Bastión Arcano — Comunidad Minecraft<br>
    <a href="https://discord.gg/tuservidor">🔮 Discord</a> |
    <a href="reglas.md">🛡 Reglas</a> |
    <a href="/">🏰 Inicio</a>
  </footer>
</body>
</html>
